{% macro password_field(name, field_id='', autocomplete='', required=false, minlength=none, input_class='auth-input', label='Password', label_class='auth-label') %}
<label class="{{ label_class }} password-label">
  <span>{{ label }}</span>
  <span class="password-field">
    <input
      class="{{ input_class }} password-input"
      type="password"
      name="{{ name }}"
      {% if field_id %}id="{{ field_id }}"{% endif %}
      {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
      {% if required %}required{% endif %}
      {% if minlength %}minlength="{{ minlength }}"{% endif %}
    >
    <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
      <svg class="password-toggle-icon password-toggle-icon--show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg class="password-toggle-icon password-toggle-icon--hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
        <path d="M3 3l18 18"/>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
        <path d="M9.9 5.1A10.8 10.8 0 0 1 12 5c7 0 10 7 10 7a17.2 17.2 0 0 1-4 5.2"/>
        <path d="M6.1 6.1A17.2 17.2 0 0 0 2 12s3 7 10 7a10.8 10.8 0 0 0 5.1-1.9"/>
      </svg>
    </button>
  </span>
</label>
{% endmacro %}
