{% from "_brand.html" import brand_lockup %}
{% from "_favicon.html" import favicon_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in — MultiWorkAgent{% endblock %}</title>
  {{ favicon_tags() }}
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-shell">
    {{ brand_lockup(href=url_for('index'), size='md', class='auth-logo') }}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
