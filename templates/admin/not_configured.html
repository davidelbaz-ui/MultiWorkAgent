<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin not configured</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-page admin-page--center">
  <div class="admin-login-card">
    <h1>Operator admin not configured</h1>
    <p>Add to <strong>Vercel → Environment Variables</strong> (Production) or local <code>.env</code>:</p>
    <pre class="admin-code">ADMIN_EMAIL=operator@example.com
ADMIN_PASSWORD=long-random-password
# or ADMIN_PASSWORD_HASH= from werkzeug</pre>
    <p class="meta-row">Redeploy on Vercel, then open <code>/admin</code> (not the customer sign-in page).</p>
  </div>
</body>
</html>
