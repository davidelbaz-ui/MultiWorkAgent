<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-page admin-page--center">
  <div class="admin-login-card">
    <h1>Operator sign in</h1>
    <p class="meta-row">Operator sign-in · <code>/admin</code></p>
    {% if error %}
    <p class="admin-flash admin-flash--error">{{ error }}</p>
    {% endif %}
    <form method="post" class="admin-form">
      <label class="admin-label">Email
        <input class="admin-input" type="email" name="email" autocomplete="username" required>
      </label>
      <label class="admin-label">Password
        <input class="admin-input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>
</body>
</html>
